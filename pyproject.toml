[project]
name = "async-gpib"
authors = [
  { name="Patrick Baus", email="patrick.baus@physik.tu-darmstadt.de" },
]
description = "Python3 AsyncIO Linux GPIB wrapper"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Topic :: Home Automation",
    "Topic :: Scientific/Engineering",
]
keywords = ["linux-gpib", "GPIB", "API"]
dynamic = ["version"]
dependencies = [
    "gpib-ctypes ~= 0.3.0",
]

[project.urls]
"Homepage" = "https://github.com/PatrickBaus/pyAsyncGpib"
"Bug Tracker" = "https://github.com/PatrickBaus/pyAsyncGpib/issues"
"Download" = "https://github.com/PatrickBaus/pyAsyncGpib/releases"

[project.optional-dependencies]
# Needed to run the test suite. pytest-cov measures the coverage, see the [tool.coverage] sections below.
test = [
    "pytest", "pytest-cov",
]
# Linters and type checkers. pylint also checks examples/ and tests/, so it needs their dependencies.
lint = [
    "async-gpib[test]",
    "black", "isort", "mypy", "pre-commit", "pylint", "setuptools",
]
# Building and publishing to PyPI
build = [
    "build", "twine",
]
# Everything needed for development
dev = [
    "async-gpib[test,lint,build]",
]

[tool.coverage.run]
# Measure only the library, not the tests or the examples
source = ["async_gpib"]
# Generated by setuptools-scm
omit = ["async_gpib/_version.py"]
branch = true
# Required by python-coverage-comment-action, it matches the paths in .coverage against the files of the repository
relative_files = true

[tool.coverage.report]
show_missing = true
# Every line and branch of the library must be covered by the tests
fail_under = 100

[tool.pylint.main]
py-version = "3.12"
# Generated by setuptools-scm
ignore = ["_version.py"]

[tool.pylint.'MESSAGES CONTROL']
max-line-length = 120

[tool.isort]
line_length = 120
profile = "black"
py_version = 312

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    # conftest.py reorders tests moving slow ones to the end of the list
    "slow",
]
filterwarnings = [
    # gpib_ctypes warns on import if the Linux GPIB library is not installed. The tests use a fake backend instead.
    "ignore:GPIB library not found:UserWarning",
]

[build-system]
requires = [
    "setuptools>=84.2.1",
    "setuptools-scm>=8.0",  # for version_file
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# The version is taken from the git tag of the release, e.g. 2.2.0. Commits after a tag get a development version
# like 2.2.1.dev3. The version is written to _version.py during the build. That file is not tracked by git.
version_file = "async_gpib/_version.py"
# Leave out the "+g<commit hash>" local version part, which PyPI and TestPyPI reject
local_scheme = "no-local-version"

[tool.setuptools.packages.find]
include = ["async_gpib*"]
