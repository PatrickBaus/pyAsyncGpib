[project]
name = "async-gpib"
authors = [
  { name="Patrick Baus", email="patrick.baus@physik.tu-darmstadt.de" },
]
description = "Python3 AsyncIO Linux GPIB wrapper"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Topic :: Home Automation",
    "Topic :: Scientific/Engineering",
]
keywords = ["linux-gpib", "GPIB", "API"]
dynamic = ["version"]
dependencies = [
    "typing-extensions; python_version <'3.11'",
    "gpib-ctypes ~= 0.3.0",
]

[project.urls]
"Homepage" = "https://github.com/PatrickBaus/pyAsyncGpib"
"Bug Tracker" = "https://github.com/PatrickBaus/pyAsyncGpib/issues"
"Download" = "https://github.com/PatrickBaus/pyAsyncGpib/releases"

[project.optional-dependencies]
# Needed to run the test suite. pytest-cov measures the coverage, see the [tool.coverage] sections below.
test = [
    "pytest", "pytest-cov",
]
# Linters and type checkers. pylint also checks examples/ and tests/, so it needs their dependencies.
lint = [
    "async-gpib[test]",
    "black", "isort", "mypy", "pre-commit", "pylint", "setuptools",
]
# Building and publishing to PyPI
build = [
    "build", "twine",
]
# Everything needed for development
dev = [
    "async-gpib[test,lint,build]",
]

[tool.coverage.run]
# Measure only the library, not the tests or the examples
source = ["async_gpib"]
# Generated by setuptools-scm
omit = ["async_gpib/_version.py"]
branch = true
# Required by python-coverage-comment-action, it matches the paths in .coverage against the files of the repository
relative_files = true

[tool.coverage.report]
show_missing = true

[tool.pylint.'MESSAGES CONTROL']
max-line-length = 120

[tool.isort]
line_length = 120
profile = "black"

[tool.black]
line-length = 120

[tool.pytest.ini_options]
markers = [
    # conftest.py reorders tests moving slow ones to the end of the list
    "slow",
]

[build-system]
requires = [
    "setuptools>=61.0",
    "typing-extensions; python_version <'3.11'",
    "gpib-ctypes"
]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "async_gpib.__version__"}
